openapi: 3.0.3
info:
  title: SplitPay API
  version: 1.0.0
  description: API сервиса совместного учета расходов и долгов в группах.
servers:
  - url: http://localhost:8080/api/v1
    description: Локальный сервер разработки

tags:
  - name: Auth
    description: Эндпоинты аутентификации и управления сессиями
  - name: Groups
    description: Управление группами пользователей
  - name: Expenses & Balances
    description: Добавление чеков, возвраты долгов и расчет баланса

paths:
  /auth/sign-up:
    post:
      tags:
        - Auth
      summary: Регистрация нового пользователя
      description: Создает нового пользователя в системе и возвращает пустой ответ в случае успеха.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignUpInput"
      responses:
        "201":
          description: Пользователь успешно создан (Created)
        "400":
          description: Ошибка валидации (неверный формат email или короткий пароль)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "409":
          description: Конфликт (пользователь с таким email уже существует)
        "500":
          description: Внутренняя ошибка сервера

  /auth/sign-in:
    post:
      tags:
        - Auth
      summary: Вход в систему (Логин)
      description: Аутентификация по email и паролю. Возвращает пару access и refresh токенов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInInput"
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Ошибка валидации запроса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationErrorResponse"
        "401":
          description: Неверный email или пароль (Unauthorized)
        "500":
          description: Внутренняя ошибка сервера

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Обновление Access-токена
      description: Принимает действующий refresh-токен и возвращает новую пару токенов.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
                  example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
      responses:
        "200":
          description: Токены успешно обновлены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "400":
          description: Ошибка запроса (отсутствует токен)
        "401":
          description: Невалидный, просроченный или отозванный refresh-токен
        "500":
          description: Внутренняя ошибка сервера

  /groups:
    post:
      tags:
        - Groups
      summary: Создание новой группы
      description: Создает новую группу для совместных расходов. Текущий авторизованный пользователь автоматически становится ее создателем и владельцем.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupInput"
      responses:
        "201":
          description: Группа успешно создана
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "401":
          description: Не авторизован
        "500":
          description: Внутренняя ошибка сервера
    get:
      tags:
        - Groups
      summary: Получение списка групп
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Успешное получение списка групп
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GroupResponse"
        "401":
          description: Не авторизован
        "500":
          description: Внутренняя ошибка сервера

  /groups/{id}:
    get:
      tags:
        - Groups
      summary: Получение деталей группы
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Детали группы успешно получены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupDetailsResponse"
        "403":
          description: Доступ запрещен

  /groups/{id}/invites:
    post:
      tags:
        - Groups
      summary: Генерация инвайта в группу
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Инвайт успешно сгенерирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResponse"
        "403":
          description: Доступ запрещен

  /groups/join:
    post:
      tags:
        - Groups
      summary: Вступление в группу
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinGroupInput"
      responses:
        "200":
          description: Пользователь успешно присоединился

  # --- НОВЫЕ ЭНДПОИНТЫ ДЛЯ РАСХОДОВ ---
  /groups/{id}/expenses:
    post:
      tags:
        - Expenses & Balances
      summary: Добавление нового чека (расхода)
      description: Фиксирует трату, указывая, кто платил и за кого (сплиты).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: UUID группы
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExpenseInput"
      responses:
        "201":
          description: Чек успешно добавлен
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseResponse"
        "400":
          description: Ошибка валидации (сумма сплитов не сходится с общей суммой)
        "403":
          description: Пользователь не в группе
        "500":
          description: Внутренняя ошибка сервера

  /groups/{id}/expenses/{expense_id}:
    delete:
      tags:
        - Expenses & Balances
      summary: Удаление чека
      description: Полностью удаляет чек и связанные с ним долги.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: expense_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Чек успешно удален (No Content)
        "403":
          description: Пользователь не в группе или не имеет прав на удаление
        "404":
          description: Чек не найден

  /groups/{id}/repayments:
    post:
      tags:
        - Expenses & Balances
      summary: Возврат долга (Settle up)
      description: Фиксирует факт возврата денег от должника к кредитору.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRepaymentInput"
      responses:
        "201":
          description: Возврат успешно зафиксирован
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepaymentResponse"
        "400":
          description: Ошибка валидации
        "403":
          description: Пользователь не в группе

  /groups/{id}/balances:
    get:
      tags:
        - Expenses & Balances
      summary: Получение балансов группы
      description: Возвращает сводку для всех участников (в плюсе или в минусе).
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Массив балансов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserBalanceResponse"
        "403":
          description: Доступ запрещен

  /groups/{id}/transactions:
    get:
      tags:
        - Expenses & Balances
      summary: История операций (Лента)
      description: Возвращает хронологический список всех чеков и возвратов в группе, отсортированный по убыванию даты.
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Успешное получение истории
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionResponse"
        "403":
          description: Доступ запрещен

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: object
          additionalProperties:
            type: string
          example:
            email: "Неверный формат email адреса"
            password: "Это поле обязательно для заполнения"

    SignUpInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          minLength: 6
          example: "secret123"

    SignInInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "secret123"

    TokenPair:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
          description: JWT Access Token
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI..."
        refresh_token:
          type: string
          description: Refresh Token
          example: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"

    CreateGroupInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: "Поездка на Алтай"

    GroupResponse:
      type: object
      required: [id, name, currency, owner_id]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, example: "RUB" }
        owner_id: { type: string, format: uuid }

    GroupMemberInfo:
      type: object
      required: [id, email, role, joined_at]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string, example: "owner" }
        joined_at: { type: string, format: date-time }

    GroupDetailsResponse:
      type: object
      required: [id, name, currency, owner_id, members]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string }
        owner_id: { type: string, format: uuid }
        members:
          type: array
          items:
            $ref: "#/components/schemas/GroupMemberInfo"

    InviteResponse:
      type: object
      required: [invite_link, expires_at]
      properties:
        invite_link: { type: string, example: "e88d752f-1234-4068-98e3-53e34b99865a" }
        expires_at: { type: string, format: date-time }

    JoinGroupInput:
      type: object
      required: [token]
      properties:
        token: { type: string, example: "e88d752f-1234-4068-98e3-53e34b99865a" }

    ExpenseSplitInput:
      type: object
      required: [user_id, amount]
      properties:
        user_id:
          type: string
          format: uuid
          description: ID участника, за которого заплатили
        amount:
          type: number
          format: float
          description: Сумма, которую должен этот участник
          example: 500.50

    CreateExpenseInput:
      type: object
      required: [description, payer_id, total_amount, splits]
      properties:
        description:
          type: string
          example: "Ужин в хинкальной"
        payer_id:
          type: string
          format: uuid
          description: Кто фактически оплатил чек
        total_amount:
          type: number
          format: float
          example: 1500.00
        splits:
          type: array
          description: Как распределяется долг
          items:
            $ref: "#/components/schemas/ExpenseSplitInput"

    ExpenseResponse:
      type: object
      required: [id, group_id, description, payer_id, total_amount, created_at]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        description: { type: string }
        payer_id: { type: string, format: uuid }
        total_amount: { type: number, format: float }
        created_at: { type: string, format: date-time }

    CreateRepaymentInput:
      type: object
      required: [from_user_id, to_user_id, amount]
      properties:
        from_user_id:
          type: string
          format: uuid
          description: Кто возвращает долг
        to_user_id:
          type: string
          format: uuid
          description: Кому возвращают долг
        amount:
          type: number
          format: float
          example: 500.00

    RepaymentResponse:
      type: object
      required: [id, group_id, from_user_id, to_user_id, amount, created_at]
      properties:
        id: { type: string, format: uuid }
        group_id: { type: string, format: uuid }
        from_user_id: { type: string, format: uuid }
        to_user_id: { type: string, format: uuid }
        amount: { type: number, format: float }
        created_at: { type: string, format: date-time }

    UserBalanceResponse:
      type: object
      required: [user_id, balance]
      properties:
        user_id:
          type: string
          format: uuid
        balance:
          type: number
          format: float
          description: "Положительный - пользователю должны. Отрицательный - пользователь должен."
          example: -500.50

    ExpenseSplitResponse:
      type: object
      required: [user_id, amount]
      properties:
        user_id:
          type: string
          format: uuid
        amount:
          type: number
          format: float
          description: Сумма долга участника по этому чеку

    TransactionResponse:
      type: object
      required: [id, type, amount, created_at]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [expense, repayment]
          description: "Тип транзакции: чек (expense) или возврат долга (repayment)"
        amount:
          type: number
          format: float
          description: Общая сумма чека или сумма возврата
        created_at:
          type: string
          format: date-time
        # --- Поля для type = expense ---
        description:
          type: string
          nullable: true
          description: "Название чека (только для expense)"
        payer_id:
          type: string
          format: uuid
          nullable: true
          description: "Кто оплатил чек (только для expense)"
        splits:
          type: array
          nullable: true
          description: "Разбивка долгов по чеку (только для expense)"
          items:
            $ref: "#/components/schemas/ExpenseSplitResponse"
        from_user_id:
          type: string
          format: uuid
          nullable: true
          description: "Кто возвращает деньги (только для repayment)"
        to_user_id:
          type: string
          format: uuid
          nullable: true
          description: "Кому возвращают деньги (только для repayment)"
