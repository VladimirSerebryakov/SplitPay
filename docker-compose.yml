services:
  postgres:
    image: postgres:15-alpine
    container_name: splitpay_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: ${REDIS_IMAGE:-redis:8-alpine}
    container_name: splitpay_redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    image: splitpay-api:local
    build: .
    environment:
      DATABASE_URL: "postgres://${DB_USER:?DB_USER is required}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:?DB_NAME is required}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REDIS_ADDR: redis:6379
      PORT: "8080"
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-30}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-1m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
